<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAFRAI - منصة الذكاء الاصطناعي الشاملة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b0b1a;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1890ff, #0050b3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #80d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* حاوية قسم المحادثة */
        .chat-container {
            max-width: 550px;
            width: calc(100% - 30px);
            margin: 10px auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            height: 65vh;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .user-msg {
            background: rgba(0, 114, 255, 0.25);
            border: 1px solid rgba(0, 114, 255, 0.35);
            align-self: flex-start;
        }

        .ai-msg {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-end;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 8px 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            resize: none;
            height: 40px;
            outline: none;
            font-size: 0.95rem;
            padding-top: 8px;
        }

        .send-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 10px;
            color: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
