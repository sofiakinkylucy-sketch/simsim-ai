<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAFRAI - منصة الذكاء الاصطناعي الشاملة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b0b1a;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* شريط العناوين العلوي */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1890ff, #0050b3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #80d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* قسم الترحيب الرئيسي */
        .hero-section {
            text-align: center;
            padding: 20px 20px 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #91d5ff;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 2.2rem;
            line-height: 1.3;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .hero-title span {
            background: linear-gradient(135deg, #00c6ff, #0072ff, #f355da);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: #a6adb4;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 450px;
            margin: 0 auto;
        }

        /* حاوية البطاقات */
        .cards-container {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            border-color: rgba(0, 198, 255, 0.4);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.07);
        }

        .card-info h3 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 0.82rem;
            color: #8c8c8c;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(0, 114, 255, 0.15);
            border: 1px solid rgba(0, 114, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0099ff;
            font-size: 1.3rem;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 420px;
            background: rgba(18, 18, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 18px;
            color: #8c8c8c;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        .nav-item i {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header-bar">
        <a href="https://t.me" class="icon-btn" title="Telegram">
            <i class="fab fa-telegram-plane"></i>
        </a>
        <div class="brand-title">JAFRAI</div>
        <div class="icon-btn" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">
            <i class="fas fa-sparkles"></i>
        </div>
    </div>

    <!-- قسم العنوان والمقدمة -->
    <div class="hero-section">
        <div class="badge">
            <i class="fas fa-bolt" style="color: #00c6ff;"></i>
            <span>منصة الذكاء الاصطناعي الشاملة</span>
        </div>
        <h1 class="hero-title">
            كل ما تحتاجه من<br>
            <span>ذكاء اصطناعي</span>
        </h1>
        <p class="hero-desc">
            محادثة ذكية، توليد صور فنية، وتحويل النص إلى صوت — كل ذلك في منصة واحدة أنيقة.
        </p>
    </div>

    <!-- بطاقات الخدمات -->
    <div class="cards-container">
        
        <!-- بطاقة المحادثة -->
        <div class="feature-card" onclick="alert('جاري فتح قسم المحادثة الذكية...')">
            <div class="card-info">
                <h3>محادثة ذكية</h3>
                <p>إجابات متدفقة وسياق مستمر</p>
            </div>
            <div class="card-icon">
                <i class="fas fa-comments"></i>
            </div>
        </div>

        <!-- بطاقة توليد الصور -->
        <div class="feature-card" onclick="alert('جاري فتح قسم توليد الصور...')">
            <div class="card-info">
                <h3>توليد صور</h3>
                <p>حول الوصف إلى صور إبداعية</p>
            </div>
            <div class="card-icon" style="color: #b37feb; background: rgba(179, 127, 235, 0.15); border-color: rgba(179, 127, 235, 0.3);">
                <i class="fas fa-wand-magic-sparkles"></i>
            </div>
        </div>

        <!-- بطاقة الصوت العربي -->
        <div class="feature-card" onclick="alert('جاري فتح قسم تحويل النص إلى صوت...')">
            <div class="card-info">
                <h3>صوت عربي</h3>
                <p>تحويل النص إلى MP3 بسهولة</p>
            </div>
            <div class="card-icon" style="color: #36cfc9; background: rgba(54, 207, 201, 0.15); border-color: rgba(54, 207, 201, 0.3);">
                <i class="fas fa-sliders-h"></i>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="#" class="nav-item">
            <i class="fas fa-volume-up"></i>
            <span>MP3</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-image"></i>
            <span>IMG</span>
        </a>
        <a href="#" class="nav-item active">
            <i class="fas fa-comments"></i>
            <span>AI</span>
        </a>
    </div>

</body>
</html>
