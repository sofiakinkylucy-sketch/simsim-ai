<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سمسم AI - منصة الذكاء الاصطناعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        header p {
            color: #b0bec5;
            font-size: 0.9rem;
        }
        .chat-box {
            min-height: 200px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background: rgba(0, 114, 255, 0.3);
            border: 1px solid rgba(0, 114, 255, 0.4);
            align-self: flex-start;
        }
        .ai-msg {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-end;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            resize: none;
            height: 50px;
            outline: none;
            font-size: 1rem;
        }
        textarea:focus {
            border-color: #00c6ff;
        }
        button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #8a8d93;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✨ سمسم AI</h1>
            <p>الجيل الجديد من الذكاء الاصطناعي متصل بـ API حقيقي</p>
        </header>

        <div id="chatBox" class="chat-box">
            <div class="message ai-msg">أهلاً بك يا سيف! أنا جاهز للإجابة عن أي سؤال أو طلب. تفضل اطرح سؤالك.</div>
        </div>

        <div class="input-group">
            <textarea id="userInput" placeholder="اكتب رسالتك هنا..."></textarea>
            <button onclick="sendMessage()">إرسال 🚀</button>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة لـ سيف ميديا © 2026.
    </footer>

    <script>
        const API_KEY = "AQ.Ab8RN6LswedK4YWxRSEVgR1_fyjNKv4i5SLqMMMpRZMM_mcgyQ"; 

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = inputField.value.trim();

            if (!text) return;

            // عرض رسالة المستخدم
            chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(text)}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // عرض مؤشر الانتظار
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message ai-msg">جاري التفكير... ⏳</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="message ai-msg">${escapeHtml(aiReply)}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai-msg" style="color: #ff6b6b;">عذراً، حدث خطأ في استجابة الـ API. تأكد من صحة المفتاح.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message ai-msg" style="color: #ff6b6b;">عذراً، تعذر الاتصال بالخادم. تحقق من إنترنت لديك.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
